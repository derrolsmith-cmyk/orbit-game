<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071525"><title>ORBIT 0.2 — Kinetic Study</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071525;color:#e6f1f4;font-family:system-ui,-apple-system,sans-serif}body{display:flex;justify-content:center}main{width:min(100%,540px);padding:17px 14px 28px;text-align:center}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}h1{font-size:23px;letter-spacing:.38em;font-weight:300;margin:0}small{color:#a2b7c4;font-size:10px;letter-spacing:.12em}canvas{width:100%;height:auto;display:block;border-radius:22px;touch-action:none;background:#081827;box-shadow:0 16px 45px #0007,inset 0 0 0 1px #ffffff20}#status{min-height:49px;padding:12px 3px;font-size:13px;color:#b9cbd3}nav{display:flex;gap:10px}button{flex:1;padding:13px 8px;border-radius:12px;border:1px solid #7ba0af55;background:#173449;color:#e6f2f4;font-size:13px}.footer{margin-top:12px;color:#7894a5;font-size:11px}</style></head><body><main><header><div><h1>ORBIT</h1><small>KINETIC STUDY</small></div><small id="level">01 / 05</small></header><canvas id="board" width="420" height="620"></canvas><div id="status">Drag backward from the launcher and release to fire.</div><nav><button id="restart">Restart composition</button><button id="next">Next composition →</button></nav><div class="footer">0.2 · PHYSICAL COLLISIONS · PREVIEW CANDIDATE</div></main><script>
(()=>{'use strict';const c=document.getElementById('board'),g=c.getContext('2d'),status=document.getElementById('status'),level=document.getElementById('level');if(!g){status.textContent='Canvas is unavailable';return}
const W=420,H=620,origin={x:210,y:551},TAU=Math.PI*2;let stage=0,balls=[],projectile=null,aim=null,shots=2,frame=0,last=0,bursts=[],done=false,shotLive=false;
const configs=[
[{cx:210,cy:255,rx:100,ry:100,n:5,speed:.008},{cx:210,cy:255,rx:45,ry:45,n:2,speed:-.014}],
[{cx:210,cy:240,rx:123,ry:79,n:6,speed:.009},{cx:210,cy:240,rx:57,ry:103,n:3,speed:-.012}],
[{cx:210,cy:250,rx:135,ry:135,n:8,speed:.008},{cx:210,cy:250,rx:62,ry:62,n:4,speed:-.017}],
[{cx:210,cy:250,rx:145,ry:82,n:7,speed:-.012},{cx:210,cy:250,rx:75,ry:140,n:4,speed:.012}],
[{cx:210,cy:248,rx:151,ry:151,n:9,speed:.009},{cx:210,cy:248,rx:85,ry:85,n:5,speed:-.016}]
];
function reset(){frame=0;last=0;balls=[];projectile=null;aim=null;shots=2;bursts=[];done=false;shotLive=false;let id=0;configs[stage].forEach((o,j)=>{for(let i=0;i<o.n;i++){let angle=i*TAU/o.n+j*.37;balls.push({id:id++,x:o.cx+o.rx*Math.cos(angle),y:o.cy+o.ry*Math.sin(angle),vx:0,vy:0,angle,orbit:o,free:false,hit:false,r:11.5,trail:[]})}});level.textContent=String(stage+1).padStart(2,'0')+' / 05';status.textContent='Aim at moving glass spheres. '+shots+' shots available.'}
function dot(x,y,r,color,alpha=1){g.save();g.globalAlpha=alpha;let grad=g.createRadialGradient(x-r*.32,y-r*.42,.3,x,y,r*2);grad.addColorStop(0,'#fff');grad.addColorStop(.12,color);grad.addColorStop(.5,color+'77');grad.addColorStop(1,'#00000000');g.fillStyle=grad;g.beginPath();g.arc(x,y,r*2,0,TAU);g.fill();g.restore()}
function activate(b,impX,impY){if(!b.free){b.free=true;b.vx=impX;b.vy=impY;b.hit=true;bursts.push({x:b.x,y:b.y,r:4,alpha:1});}}
function collide(a,b){let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,min=a.r+b.r;if(d>=min)return;let nx=dx/d,ny=dy/d,overlap=min-d;a.x-=nx*overlap*.5;a.y-=ny*overlap*.5;b.x+=nx*overlap*.5;b.y+=ny*overlap*.5;let rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(rel>0){let impulse=rel*.92;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny}if(a.free&&!b.free)activate(b,b.vx+nx*2.4,b.vy+ny*2.4);if(b.free&&!a.free)activate(a,a.vx-nx*2.4,a.vy-ny*2.4);if(a.free||b.free)bursts.push({x:(a.x+b.x)/2,y:(a.y+b.y)/2,r:3,alpha:.8})}
function update(){frame++;for(let b of balls){if(!b.free){let prevX=b.x,prevY=b.y;b.angle+=b.orbit.speed;b.x=b.orbit.cx+b.orbit.rx*Math.cos(b.angle);b.y=b.orbit.cy+b.orbit.ry*Math.sin(b.angle);b.vx=b.x-prevX;b.vy=b.y-prevY}else{b.x+=b.vx;b.y+=b.vy;b.vx*=.998;b.vy*=.998;if(b.x<b.r||b.x>W-b.r){b.x=Math.max(b.r,Math.min(W-b.r,b.x));b.vx*=-.86}if(b.y<b.r||b.y>H-85){b.y=Math.max(b.r,Math.min(H-85,b.y));b.vy*=-.86}}b.trail.push({x:b.x,y:b.y});if(b.trail.length>16)b.trail.shift()}
if(projectile){projectile.x+=projectile.vx;projectile.y+=projectile.vy;projectile.vx*=.999;projectile.vy*=.999;if(projectile.x<0||projectile.x>W||projectile.y<0||projectile.y>H){projectile=null;shotLive=false}}
for(let i=0;i<balls.length;i++){let b=balls[i];if(projectile&&Math.hypot(b.x-projectile.x,b.y-projectile.y)<b.r+projectile.r){let dx=b.x-projectile.x,dy=b.y-projectile.y,d=Math.hypot(dx,dy)||1;activate(b,projectile.vx*.85+dx/d*1.5,projectile.vy*.85+dy/d*1.5);projectile.vx*=.3;projectile.vy*=.3;projectile=null;shotLive=false}for(let j=i+1;j<balls.length;j++)collide(b,balls[j])}
if(!done&&balls.every(b=>b.hit)){done=true;status.textContent='Perfect chain — every sphere displaced ✦'}else if(!projectile&&shots===0&&!done&&frame%120===0)status.textContent='Chain in motion. Restart to try a new approach.';bursts=bursts.filter(x=>x.alpha>.025);for(let p of bursts){p.r+=2.2;p.alpha*=.955}}
function render(){g.clearRect(0,0,W,H);let bg=g.createRadialGradient(210,235,5,210,285,420);bg.addColorStop(0,'#193c4c');bg.addColorStop(1,'#071525');g.fillStyle=bg;g.fillRect(0,0,W,H);
for(let o of configs[stage]){g.strokeStyle='#9ac8d326';g.lineWidth=1;g.beginPath();g.ellipse(o.cx,o.cy,o.rx,o.ry,0,0,TAU);g.stroke()}
for(let b of balls){for(let i=1;i<b.trail.length;i++){let p=b.trail[i-1],q=b.trail[i];g.strokeStyle=b.free?'rgba(247,190,123,'+(i/b.trail.length*.24)+')':'rgba(101,218,230,'+(i/b.trail.length*.19)+')';g.lineWidth=1.7;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(q.x,q.y);g.stroke()}dot(b.x,b.y,b.r,b.free?'#eeb779':'#6fd8e1')}
for(let p of bursts){g.strokeStyle='rgba(252,221,171,'+p.alpha+')';g.lineWidth=1.5;g.beginPath();g.arc(p.x,p.y,p.r,0,TAU);g.stroke()}
if(projectile)dot(projectile.x,projectile.y,9,'#f7e1b0');dot(origin.x,origin.y,13,'#f4d6a0');g.textAlign='center';g.font='11px system-ui';g.fillStyle='#a5bdc8';g.fillText('LAUNCH',210,592);
if(aim){let dx=origin.x-aim.x,dy=origin.y-aim.y,d=Math.hypot(dx,dy);if(d>12){for(let i=1;i<17;i++){let x=origin.x+dx/d*i*18,y=origin.y+dy/d*i*18;if(x<5||x>W-5||y<5||y>H-5)break;g.fillStyle='rgba(211,241,244,'+(1-i/19)+')';g.beginPath();g.arc(x,y,2.2,0,TAU);g.fill()}}}}
function loop(t){if(!last)last=t;let delta=Math.min(40,t-last);last=t;update();render();requestAnimationFrame(loop)}
function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
c.addEventListener('pointerdown',e=>{if(projectile||shots<=0||done)return;aim=point(e);c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(aim)aim=point(e)});c.addEventListener('pointerup',e=>{if(!aim)return;let p=point(e),dx=origin.x-p.x,dy=origin.y-p.y,d=Math.hypot(dx,dy);aim=null;if(d<20)return;projectile={x:origin.x,y:origin.y,vx:dx/d*9.2,vy:dy/d*9.2,r:9};shots--;status.textContent=shots+' shot(s) left. Watch the trajectories change.'});c.addEventListener('pointercancel',()=>aim=null);
document.getElementById('restart').onclick=reset;document.getElementById('next').onclick=()=>{stage=(stage+1)%configs.length;reset()};reset();requestAnimationFrame(loop);
})();</script></body></html>
